name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare portable exe
        shell: pwsh
        run: |
          Copy-Item target\release\claude-code-usage-monitor.exe ai-usage-monitor.exe

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build MSI installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          cargo wix --no-build --nocapture --output "ai-usage-monitor-$version.msi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-usage-monitor.exe
            ai-usage-monitor-*.msi
          generate_release_notes: true
